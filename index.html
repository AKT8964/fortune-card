<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#fff8f1"><title>今日運勢籤</title><style>
:root{background:#fff8f1;color:#3e2a24;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#fff8f1}
body{display:flex;justify-content:center}
button{font:inherit}
.app{width:100%;max-width:620px;min-height:100vh;padding:20px 12px 36px}
h1{margin:4px 0 5px;text-align:center;font-size:32px;font-weight:900;letter-spacing:.08em}
.sub{text-align:center;margin:0 0 16px;color:#816c64;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%}
.card{border:0;background:transparent;padding:0;margin:0;display:block;width:100%;aspect-ratio:1.48;perspective:900px;cursor:pointer;touch-action:manipulation}
.flip{display:block;position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .62s cubic-bezier(.2,.75,.2,1)}
.card.chosen .flip{transform:rotateY(180deg)}
.side{position:absolute;inset:0;border-radius:14px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 5px 14px rgba(72,42,30,.16)}
.back{display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff;background:linear-gradient(145deg,#c94a41,#9f2928);border:3px solid #fff;outline:2px solid #c94a41}
.back:before{content:"";position:absolute;width:62%;aspect-ratio:1;border:2px solid rgba(255,255,255,.65);transform:rotate(45deg);border-radius:22px}
.paw{font-size:34px;z-index:1}.backText{font-size:12px;font-weight:800;letter-spacing:.16em;margin-top:5px;z-index:1}
.front{transform:rotateY(180deg);background:#fff}
.front img{width:100%;height:100%;display:block;object-fit:cover}
.status{text-align:center;margin:17px 0 0;color:#806c65;font-size:14px}
.modal{position:fixed;inset:0;background:rgba(30,19,15,.66);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}
.modal.show{display:flex}
.panel{width:min(94vw,560px);display:flex;flex-direction:column;align-items:center;gap:12px}
.big{width:100%;max-height:78vh;overflow:hidden;border-radius:17px;background:#fff;box-shadow:0 18px 60px rgba(0,0,0,.35)}
.big img{display:block;width:100%;height:auto;max-height:78vh;object-fit:contain}
.action{border:0;border-radius:999px;background:#fff;padding:11px 24px;font-weight:900;color:#49322b}
@media(max-width:380px){.app{padding-left:8px;padding-right:8px}.grid{gap:7px}.side{border-radius:11px}}
</style></head>
<body>
<main class="app">
<h1>今日運勢籤</h1>
<p class="sub">憑直覺選一張，看看今天給你的提醒</p>
<div id="grid" class="grid"><button class="card" type="button" data-card="1" aria-label="抽第 1 張籤">
  <span class="flip">
    <span class="side back"><span class="paw">🐾</span><span class="backText">今日運勢</span></span>
    <span class="side front"><img src="card-1.png" alt="運勢籤 1"></span>
  </span>
</button>
<button class="card" type="button" data-card="2" aria-label="抽第 2 張籤">
  <span class="flip">
    <span class="side back"><span class="paw">🐾</span><span class="backText">今日運勢</span></span>
    <span class="side front"><img src="card-2.png" alt="運勢籤 2"></span>
  </span>
</button>
<button class="card" type="button" data-card="3" aria-label="抽第 3 張籤">
  <span class="flip">
    <span class="side back"><span class="paw">🐾</span><span class="backText">今日運勢</span></span>
    <span class="side front"><img src="card-3.png" alt="運勢籤 3"></span>
  </span>
</button>
<button class="card" type="button" data-card="4" aria-label="抽第 4 張籤">
  <span class="flip">
    <span class="side back"><span class="paw">🐾</span><span class="backText">今日運勢</span></span>
    <span class="side front"><img src="card-4.png" alt="運勢籤 4"></span>
  </span>
</button>
<button class="card" type="button" data-card="5" aria-label="抽第 5 張籤">
  <span class="flip">
    <span class="side back"><span class="paw">🐾</span><span class="backText">今日運勢</span></span>
    <span class="side front"><img src="card-5.png" alt="運勢籤 5"></span>
  </span>
</button>
<button class="card" type="button" data-card="6" aria-label="抽第 6 張籤">
  <span class="flip">
    <span class="side back"><span class="paw">🐾</span><span class="backText">今日運勢</span></span>
    <span class="side front"><img src="card-6.png" alt="運勢籤 6"></span>
  </span>
</button>
<button class="card" type="button" data-card="7" aria-label="抽第 7 張籤">
  <span class="flip">
    <span class="side back"><span class="paw">🐾</span><span class="backText">今日運勢</span></span>
    <span class="side front"><img src="card-7.png" alt="運勢籤 7"></span>
  </span>
</button>
<button class="card" type="button" data-card="8" aria-label="抽第 8 張籤">
  <span class="flip">
    <span class="side back"><span class="paw">🐾</span><span class="backText">今日運勢</span></span>
    <span class="side front"><img src="card-8.png" alt="運勢籤 8"></span>
  </span>
</button>
<button class="card" type="button" data-card="9" aria-label="抽第 9 張籤">
  <span class="flip">
    <span class="side back"><span class="paw">🐾</span><span class="backText">今日運勢</span></span>
    <span class="side front"><img src="card-9.png" alt="運勢籤 9"></span>
  </span>
</button></div>
<p id="status" class="status">選一張你第一眼最想點的牌</p>
<button id="again" class="action" style="display:none">再抽一次</button>
</main>
<div id="modal" class="modal" role="dialog" aria-modal="true">
 <div class="panel">
  <div class="big"><img id="modalImg" alt="抽到的運勢籤"></div>
  <button id="close" class="action">再抽一次</button>
 </div>
</div>
<script>
(function(){
  "use strict";
  var grid=document.getElementById("grid");
  var modal=document.getElementById("modal");
  var modalImg=document.getElementById("modalImg");
  var closeBtn=document.getElementById("close");
  var again=document.getElementById("again");
  var status=document.getElementById("status");
  var locked=false;

  function shuffle(a){
    for(var i=a.length-1;i>0;i--){
      var j=Math.floor(Math.random()*(i+1));
      var t=a[i]; a[i]=a[j]; a[j]=t;
    }
    return a;
  }
  function arrange(){
    var nodes=Array.prototype.slice.call(grid.children);
    shuffle(nodes).forEach(function(n){grid.appendChild(n);});
  }
  function pick(btn){
    if(locked) return;
    locked=true;
    var n=btn.getAttribute("data-card");
    btn.classList.add("chosen");
    status.textContent="正在翻牌…";
    window.setTimeout(function(){
      modalImg.src="card-"+n+".png";
      modal.classList.add("show");
      status.textContent="這就是今天給你的提醒";
    },650);
  }
  Array.prototype.slice.call(document.querySelectorAll(".card")).forEach(function(btn){
    btn.addEventListener("click",function(){pick(btn);});
    btn.addEventListener("touchend",function(e){e.preventDefault();pick(btn);},{passive:false});
  });
  function reset(){
    modal.classList.remove("show");
    document.querySelectorAll(".card").forEach(function(x){x.classList.remove("chosen");});
    locked=false; status.textContent="選一張你第一眼最想點的牌"; arrange();
  }
  closeBtn.addEventListener("click",reset);
  again.addEventListener("click",reset);
  modal.addEventListener("click",function(e){if(e.target===modal) reset();});
  arrange();
})();
</script>
</body></html>
